  <rect x="120" y="200" width="100" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="120" y="220" width="140" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="120" y="240" width="120" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="120" y="260" width="140" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="120" y="280" width="80" height="8" rx="4" fill="#d9d9d9"/>
  <!-- File B (front) -->
  <rect x="230" y="190" width="190" height="240" rx="12" fill="url(#sheet)"/>
  <rect x="250" y="220" width="80" height="8" rx="4" fill="#722ed1" opacity="0.6"/>
  <rect x="250" y="240" width="150" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="250" y="260" width="150" height="8" rx="4" fill="#52c41a" opacity="0.7"/>
  <rect x="250" y="280" width="150" height="8" rx="4" fill="#52c41a" opacity="0.7"/>
  <rect x="250" y="300" width="150" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="250" y="320" width="150" height="8" rx="4" fill="#52c41a" opacity="0.7"/>
  <rect x="250" y="340" width="100" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="250" y="360" width="150" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="250" y="380" width="130" height="8" rx="4" fill="#faad14" opacity="0.6"/>
  <!-- Arrow from A to B -->
  <path d="M200 260 L230 260" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <polygon points="228,252 244,260 228,268" fill="#ffffff" opacity="0.9"/>
