<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#722ed1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)"/>
  <!-- File A (back) -->
  <rect x="100" y="90" width="180" height="230" rx="12" fill="url(#sheet)" opacity="0.85"/>
  <rect x="120" y="120" width="80" height="8" rx="4" fill="#1890ff" opacity="0.6"/>
  <rect x="120" y="140" width="140" height="8" rx="4" fill="#d9d9d9"/>
  <rect x="120" y="160" width="140" height="8" rx="4" fill="#d9d9d9"/>
